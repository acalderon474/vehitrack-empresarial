name: Publicar Vehitrack Empresarial

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npx ng build --configuration production --base-href /vehitrack-empresarial/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicacion compilada
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/vehitrack-empresarial/browser

      - name: Publicar aplicacion
        id: deployment
        uses: actions/deploy-pages@v4
